name: Security & Policy Validation CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Manifest Syntax
        run: |
          test -f cosign-attestation.yml
          echo "Manifest syntax verified."
      - name: Verify Architecture Asset
        run: |
          test -f docs/sigstore_cosign_slsa_flow.png
          echo "Architecture flow diagram verified."
      - name: Run SRE Validation Drill
        run: |
          chmod +x scripts/validate.sh
          bash scripts/validate.sh
